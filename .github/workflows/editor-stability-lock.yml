name: Refresh pinned editor stability patch lock
on:
  push:
    branches: [codex/editor-test-stability]
    paths: [.github/workflows/editor-stability-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'isqiwen/wangqiwen.me' && github.ref == 'refs/heads/codex/editor-test-stability'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Preserve every resolution and validate the patch with a frozen install
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const {createHash} = require('node:crypto');
          const patch = 'patches/next@15.5.21.patch';
          const digest = text => createHash('sha256').update(text).digest('hex');
          const originalPatch = fs.readFileSync(patch, 'utf8');
          if (digest(originalPatch) !== 'eac6dcf8cb0b0ed2685a814a57d1a3e86cd8d9351919bf3105045949afee5974') throw new Error('Patch differs from reviewed input');
          const canonicalPatch = originalPatch.replace(/^--- a\/(.+)\n\+\+\+ b\/(.+)\n/gm, 'diff --git a/$1 b/$2\n--- a/$1\n+++ b/$2\n');
          const hash = digest(canonicalPatch);
          if (hash !== '22eb2bddf4d9d421ce04141532a653d828a9bd09797f235b8dc9afcfea83934f') throw new Error('Unexpected canonical patch');
          fs.writeFileSync(patch, canonicalPatch);
          const before = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          if (before.includes('\npatchedDependencies:\n')) throw new Error('Patch already recorded; review instead of replacing it');
          const needle = '15.5.21(@playwright/test';
          if (before.split(needle).length !== 3) throw new Error('Unexpected Next.js dependency references');
          const after = before.replace('\nimporters:\n', `\npatchedDependencies:\n  next@15.5.21:\n    hash: ${hash}\n    path: ${patch}\n\nimporters:\n`).replaceAll(needle, `15.5.21(patch_hash=${hash})(@playwright/test`);
          if (before.split('\npackages:\n')[1].split('\nsnapshots:\n')[0] !== after.split('\npackages:\n')[1].split('\nsnapshots:\n')[0]) throw new Error('Package metadata changed');
          fs.writeFileSync('pnpm-lock.yaml', after);
          NODE
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsx --test tests/next-dev-route-snapshot.test.ts
          git diff --exit-code -- package.json
          git add pnpm-lock.yaml patches/next@15.5.21.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: record and verify pinned Next.js route snapshot patch'
          git push origin HEAD:refs/heads/codex/editor-test-stability
