# Temporary, branch-scoped lockfile refresh; removed before this PR is ready.
name: Refresh release dependency lock

on:
  push:
    branches: [codex/release-safety-hardening]
    paths: [.github/workflows/refresh-release-lock.yml]

permissions:
  contents: read

jobs:
  refresh:
    if: github.repository == 'isqiwen/wangqiwen.me' && github.ref == 'refs/heads/codex/release-safety-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Pin only the two audited transitive fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (pkg.pnpm.overrides.nanoid !== '3.3.17' || pkg.pnpm.overrides['fast-uri']) {
            throw new Error('Dependency overrides changed; refuse an unexpected update.');
          }
          pkg.pnpm.overrides.nanoid = '3.3.18';
          pkg.pnpm.overrides['fast-uri'] = '3.1.6';
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile --registry=https://registry.npmjs.org
          git diff --check
          git diff --stat
          pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org
      - name: Commit the package-manager-generated lockfile to the repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git commit -m 'fix: patch nanoid and fast-uri security advisories'
          git push origin HEAD:refs/heads/codex/release-safety-hardening
