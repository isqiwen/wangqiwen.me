name: Apply editor concurrency repair
on:
  push:
    branches: [codex/editor-save-conflicts]
    paths: [.github/workflows/apply-editor-save-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'isqiwen/wangqiwen.me' && github.ref == 'refs/heads/codex/editor-save-conflicts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply the checked patch
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = cd8f2e69a67f415f81d0a776a2f7f6d5dc557111
          python3 <<'PY'
          import base64, zlib, hashlib, pathlib
          data = zlib.decompress(base64.b64decode('', validate=True))
          assert hashlib.sha256(data).hexdigest() == '576c3dd3b0a5faa657fd9539c21e954a8bfc033f926265ab909388bf5a0241b2'
          pathlib.Path('/tmp/editor-save.patch').write_bytes(data)
          PY
          git apply --check /tmp/editor-save.patch
          git apply /tmp/editor-save.patch
          git rm .github/workflows/apply-editor-save-fix.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: prevent stale editor saves from overwriting newer content'
          git push origin HEAD:codex/editor-save-conflicts
