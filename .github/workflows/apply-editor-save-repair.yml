name: Apply verified editor save repair
on:
  push:
    branches: [codex/editor-save-conflicts]
    paths: [.github/workflows/apply-editor-save-repair.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'isqiwen/wangqiwen.me' && github.ref == 'refs/heads/codex/editor-save-conflicts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and apply source changes
        run: |
          test "$(git rev-parse HEAD^)" = 3c7d75107a7b215b021fdf8eff0f0700c853b9af
          python3 <<'PY'
          import pathlib, hashlib, base64, zlib
          source = pathlib.Path('.github/workflows/apply-editor-save-fix.yml').read_text()
          encoded = source.split("base64.b64decode('", 1)[1].split("', validate=True)", 1)[0]
          assert hashlib.sha256(encoded.encode()).hexdigest() == '51c8b8c1fe7ab0a8ff8633484ca8323bf124f56dacad470dd88f50eef1dbefbd'
          corrections = [[2516, 2516, 'r'], [2609, 2609, 'a/1'], [2629, 2629, 'vMwi6'], [2750, 2752, '5'], [4708, 4709, '']]
          for start, end, replacement in reversed(corrections):
              encoded = encoded[:start] + replacement + encoded[end:]
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '576c3dd3b0a5faa657fd9539c21e954a8bfc033f926265ab909388bf5a0241b2'
          pathlib.Path('/tmp/editor-save.patch').write_bytes(patch)
          PY
          git apply --check /tmp/editor-save.patch
          git apply /tmp/editor-save.patch
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/editor-save-conflicts.spec.ts')
          source = path.read_text()
          assert source.count('  await page.reload();') == 1
          path.write_text(source.replace('  await page.reload();', '  page.once("dialog", dialog => dialog.accept());\n  await page.reload();'))
          PY
          git rm .github/workflows/apply-editor-save-fix.yml .github/workflows/editor-patch-transfer.yml .github/workflows/apply-editor-save-repair.yml
          git add -A
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: prevent stale editor saves from overwriting newer content'
          git push origin HEAD:codex/editor-save-conflicts
