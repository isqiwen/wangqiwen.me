name: Dependency audit

# CI audits dependencies only when code changes. This catches advisories that
# are published while the repository is quiet.
on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same gate as the CI audit job: the installation mirror may not
      # implement npm's security-audit endpoint.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org
