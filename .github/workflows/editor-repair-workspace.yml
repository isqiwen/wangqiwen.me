name: Export editor repair workspace
on:
  push:
    branches: [codex/editor-save-conflicts]
    paths: [.github/workflows/editor-repair-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/editor-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: editor-repair-source
          path: ${{ runner.temp }}/editor-source.tar.gz
          retention-days: 1
