name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  UPSTASH_REDIS_REST_URL: ""
  UPSTASH_REDIS_REST_TOKEN: ""

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Check deployment scripts
        run: |
          for script in scripts/vps/*.sh; do bash -n "$script"; done
          sudo apt-get update
          sudo apt-get install -y bats
          bats tests/vps

  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify editor stability with three independent no-retry runs
        shell: bash
        run: |
          set -o pipefail
          mkdir -p editor-logs
          for pass in 1 2 3; do
            echo "Editor stability pass $pass/3 (retries disabled)"
            PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/pass-$pass" \
              pnpm test:e2e --retries=0 --output="test-results/pass-$pass" \
              2>&1 | tee "editor-logs/pass-$pass.log"
          done
      - name: Preserve browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: editor-test-results
          path: |
            playwright-report/
            test-results/
            editor-logs/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare real unpublished build fixtures
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const status of ['draft', 'archived']) {
            const id = `ci-${status}-boundary`;
            const directory = `app/(post)/2099/${id}`;
            if (fs.existsSync(directory)) throw new Error(`Fixture path already exists: ${directory}`);
            fs.mkdirSync(directory, { recursive: true });
            const metadata = { id, title: `Private ${status} fixture`, description: 'Must never appear in the public artifact.', publishedAt: '2099-01-01', status, tags: [] };
            fs.writeFileSync(`${directory}/article.mdx`, `export const metadata = ${JSON.stringify(metadata, null, 2)};\n\n## Private content\n\nThis is an unpublished build fixture.\n`);
          }
          NODE
          pnpm sync:posts -- --silent
      - name: Build and assemble the deployment runtime
        run: |
          pnpm build
          pnpm sync:posts -- --published-only --silent
          node scripts/vps/assemble-artifact.cjs . dist/smoke
          pnpm sync:posts -- --silent
      - name: Smoke test the assembled artifact, including private-content isolation
        env:
          SMOKE_APP_DIR: dist/smoke
        run: pnpm test:smoke

  release-gate:
    if: ${{ always() }}
    needs: [validate, editor, audit, production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all release checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results = JSON.parse(process.env.RESULTS); for (const [name, job] of Object.entries(results)) { console.log(`${name}: ${job.result}`); if (job.result !== "success") process.exitCode = 1; }'
