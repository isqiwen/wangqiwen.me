name: Editor stability workspace
on:
  push:
    branches: [codex/editor-test-stability]
    paths: [.github/workflows/editor-stability-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    if: github.repository == 'isqiwen/wangqiwen.me' && github.ref == 'refs/heads/codex/editor-test-stability'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export source and installed test runtime without credentials
        run: |
          mkdir -p "$RUNNER_TEMP/editor-runtime"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/editor-runtime"
          cp -a node_modules "$RUNNER_TEMP/editor-runtime/node_modules"
          mkdir -p "$RUNNER_TEMP/editor-runtime/.diagnostic-bin"
          cp "$(command -v node)" "$RUNNER_TEMP/editor-runtime/.diagnostic-bin/node"
          cp -a public/fonts "$RUNNER_TEMP/editor-runtime/public/fonts"
          tar -czf "$RUNNER_TEMP/editor-runtime.tar.gz" -C "$RUNNER_TEMP/editor-runtime" .
      - uses: actions/upload-artifact@v4
        with:
          name: editor-stability-workspace
          path: ${{ runner.temp }}/editor-runtime.tar.gz
          retention-days: 1
