name: Verify editor patch transport
on:
  push:
    branches: [codex/editor-save-conflicts]
    paths: [.github/workflows/editor-patch-transfer.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cp .github/workflows/apply-editor-save-fix.yml "$RUNNER_TEMP/patch-transport.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: editor-patch-transport
          path: ${{ runner.temp }}/patch-transport.txt
          retention-days: 1
