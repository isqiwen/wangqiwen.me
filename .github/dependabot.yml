version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      # next, @next/mdx and eslint-config-next are released and pinned together.
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
    ignore:
      # The site stays on the Next.js 15.5 line; a major is a migration.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@next/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # Kept below the runtime on purpose; see docs/release-safety.md.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
